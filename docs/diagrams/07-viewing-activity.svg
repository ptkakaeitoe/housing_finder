ize="19" font-weight="500" fill="#20242a" text-anchor="middle"><tspan x="1378" dy="0">Decline</tspan></text><path d="M1145,955 L1122,955 L1122,1064" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1135" y="1024" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">[accept]</text><path d="M1355,955 L1378,955 L1378,1064" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1380" y="1024" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">[decline]</text><path d="M1250,1182.0 1268.0,1200 1250,1218.0 1232.0,1200Z" fill="white" stroke="#cbd1d7" stroke-width="1.7"/><text x="1250" y="1206" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#20242a" text-anchor="middle"><tspan x="1250" dy="0"></tspan></text><path d="M1122,1136 L1122,1200 L1232,1200" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1378,1136 L1378,1200 L1268,1200" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="585.0" y="1238.0" width="330" height="84" rx="15" fill="white" stroke="#cbd1d7" stroke-width="1.5"/><text x="750" y="1275" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#20242a" text-anchor="middle"><tspan x="750" dy="0">Check owner / active / pending;</tspan><tspan x="750" dy="25">apply accepted or declined</tspan></text><path d="M1250,1218 L1250,1280 L915,1280" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="585.0" y="1388.0" width="330" height="84" rx="15" fill="white" stroke="#cbd1d7" stroke-width="1.5"/><text x="750" y="1425" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#20242a" text-anchor="middle"><tspan x="750" dy="0">Return result; refresh</tspan><tspan x="750" dy="25">landlord requests</tspan></text><path d="M750,1322 L750,1388" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="85.0" y="1388.0" width="330" height="84" rx="15" fill="white" stroke="#cbd1d7" stroke-width="1.5"/><text x="250" y="1425" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#20242a" text-anchor="middle"><tspan x="250" dy="0">Load own requests</tspan><tspan x="250" dy="25">and read updated status</tspan></text><path d="M585,1430 L415,1430" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="250" cy="1535" r="14" fill="white" stroke="#20242a" stroke-width="2"/><circle cx="250" cy="1535" r="8" fill="#20242a" stroke="#20242a" stroke-width="2"/><path d="M250,1472 L250,1521" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="30" y="1630" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#626b75" text-anchor="start"><tspan x="30" dy="0">No landlord response leaves the stored status pending. A rejected status update shows an error and preserves the record.</tspan></text></svg>