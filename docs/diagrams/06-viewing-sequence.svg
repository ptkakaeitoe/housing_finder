<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="1570" viewBox="0 0 1860 1570" role="img" aria-labelledby="title desc"><title id="title">HousingFinder — viewing sequence</title><desc id="desc">A student requests a viewing through the React UI, Supabase verifies the user and policies validate the insert, then the landlord responds through a secure database function.</desc><defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#626b75" stroke-width="1.7"/></marker>
<marker id="triangle" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 12 6.5 1 12Z" fill="white" stroke="#626b75" stroke-width="1.5"/></marker>
</defs><rect width="1860" height="1570" fill="white"/><rect x="9" y="35" width="182" height="65" rx="0" fill="#f5f6f7" stroke="#cbd1d7" stroke-width="1.5"/><text x="100" y="75" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#20242a" text-anchor="middle"><tspan x="100" dy="0">Student</tspan></text><path d="M100,100 L100,1440" fill="none" stroke="#cbd1d7" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 5"/><rect x="339" y="35" width="182" height="65" rx="0" fill="#f5f6f7" stroke="#cbd1d7" stroke-width="1.5"/><text x="430" y="75" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#20242a" text-anchor="middle"><tspan x="430" dy="0">Student UI</tspan></text><path d="M430,100 L430,1440" fill="none" stroke="#cbd1d7" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 5"/><rect x="669" y="35" width="182" height="65" rx="0" fill="#f5f6f7" stroke="#cbd1d7" stroke-width="1.5"/><text x="760" y="75" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#20242a" text-anchor="middle"><tspan x="760" dy="0">Supabase Auth</tspan></text><path d="M760,100 L760,1440" fill="none" stroke="#cbd1d7" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 5"/><rect x="999" y="35" width="182" height="65" rx="0" fill="#f5f6f7" stroke="#cbd1d7" stroke-width="1.5"/><text x="1090" y="75" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#20242a" text-anchor="middle"><tspan x="1090" dy="0">PostgreSQL / RLS</tspan></text><path d="M1090,100 L1090,1440" fill="none" stroke="#cbd1d7" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 5"/><rect x="1329" y="35" width="182" height="65" rx="0" fill="#f5f6f7" stroke="#cbd1d7" stroke-width="1.5"/><text x="1420" y="75" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#20242a" text-anchor="middle"><tspan x="1420" dy="0">Landlord UI</tspan></text><path d="M1420,100 L1420,1440" fill="none" stroke="#cbd1d7" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 5"/><rect x="1659" y="35" width="182" height="65" rx="0" fill="#f5f6f7" stroke="#cbd1d7" stroke-width="1.5"/><text x="1750" y="75" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#20242a" text-anchor="middle"><tspan x="1750" dy="0">Landlord</tspan></text><path d="M1750,100 L1750,1440" fill="none" stroke="#cbd1d7" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 5"/><rect x="30" y="122" width="1800" height="37" rx="0" fill="#f5f6f7" stroke="none" stroke-width="1.5"/><text x="45" y="147" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#20242a" text-anchor="start"><tspan x="45" dy="0">1 · Student creates a request</tspan></text><path d="M100,205 L430,205" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="265.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">Home, future slot and message</text><path d="M430,275 L760,275" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="595.0" y="262" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">auth.getUser()</text><path d="M760,335 L430,335" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="595.0" y="322" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">Authenticated user</text><rect x="238" y="365" width="782" height="70" rx="0" fill="#fff8fa" stroke="#e0c5cc" stroke-width="1.5"/><text x="256" y="393" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#20242a" text-anchor="start"><tspan x="256" dy="0">Alternative: no user → redirect to /login; stop this request attempt.</tspan></text><text x="256" y="418" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#626b75" text-anchor="start"><tspan x="256" dy="0">Invalid/missing date or time → show a form error; do not insert.</tspan></text><path d="M430,467 L505,467 L505,500 L430,500" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="525" y="477" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="start" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">Validate a future date/time</text><path d="M430,555 L1090,555" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="760.0" y="542" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">INSERT viewing_requests {listing_id, student_id, preferred_at, message}</text><rect x="955" y="579" width="600" height="86" rx="0" fill="#f5f6f7" stroke="#cbd1d7" stroke-width="1.5"/><text x="974" y="607" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#20242a" text-anchor="start"><tspan x="974" dy="0">RLS/constraints: active account, student role, matching user,</tspan><tspan x="974" dy="25">published listing, future time, status = pending.</tspan></text><path d="M1090,705 L430,705" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="760.0" y="692" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">Insert result; record starts pending</text><path d="M430,765 L100,765" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="265.0" y="731" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">Navigate to /appointments; show</text><text x="265.0" y="752" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">request status</text><rect x="30" y="810" width="1800" height="37" rx="0" fill="#f5f6f7" stroke="none" stroke-width="1.5"/><text x="45" y="835" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#20242a" text-anchor="start"><tspan x="45" dy="0">2 · Landlord reviews and responds</tspan></text><path d="M1750,890 L1420,890" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1585.0" y="877" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">Open own viewing requests</text><path d="M1420,955 L1090,955" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1255.0" y="921" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">SELECT requests for landlord-owned</text><text x="1255.0" y="942" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">listings</text><path d="M1090,1015 L1420,1015" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="1255.0" y="1002" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">Owned viewing request records</text><path d="M1750,1085 L1420,1085" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1585.0" y="1072" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">Choose accepted or declined</text><path d="M1420,1155 L1090,1155" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1255.0" y="1121" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">RPC set_viewing_status(request_id,</text><text x="1255.0" y="1142" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">next_status)</text><rect x="940" y="1175" width="640" height="76" rx="0" fill="#f5f6f7" stroke="#cbd1d7" stroke-width="1.5"/><text x="958" y="1203" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#20242a" text-anchor="start"><tspan x="958" dy="0">Function checks active account, valid next status,</tspan><tspan x="958" dy="25">listing ownership and current status = pending.</tspan></text><path d="M1090,1290 L1420,1290" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="1255.0" y="1256" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">Success; landlord UI refreshes</text><text x="1255.0" y="1277" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">requests/badge</text><path d="M430,1360 L1090,1360" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="760.0" y="1347" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">Student loads/refetches own viewing requests</text><path d="M1090,1420 L430,1420" fill="none" stroke="#626b75" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="760.0" y="1407" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626b75" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round">Updated status: accepted or declined</text><text x="35" y="1500" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#626b75" text-anchor="start"><tspan x="35" dy="0">Errors return to the UI for display; no success navigation is shown on a failed insert or status update.</tspan></text><text x="35" y="1538" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#626b75" text-anchor="start"><tspan x="35" dy="0">There is no email/SMS step. Landlord badges poll every 15 seconds while visible and refresh on focus or local changes.</tspan></text></svg>