"/><ellipse cx="960" cy="1372" rx="400" ry="33" fill="white" stroke="#cbd1d7" stroke-width="1.7"/><text x="960" y="1379" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#20242a" text-anchor="middle"><tspan x="960" dy="0">Moderate accounts and inspect viewings</tspan></text><text x="30" y="1503" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#626b75" text-anchor="start"><tspan x="30" dy="0">All three signed-in roles also use the common “All users” capabilities. Protected use cases require appropriate access.</tspan></text></svg>